name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Verify read-only kernel inventory on actual Ubuntu runner
        run: |
          lksu kernel-inventory --json > /tmp/lksu-kernel-inventory.json
          python - <<'PY'
          import json
          with open('/tmp/lksu-kernel-inventory.json') as handle:
              info = json.load(handle)
          assert info['distribution'] == 'ubuntu', info
          assert info['automatic_updates'] == 'blocked', info
          assert info['automatic_reboot'] == 'blocked', info
          assert isinstance(info['installed_kernel_packages'], list)
          print('Verified Ubuntu read-only kernel package inventory')
          PY
      - run: python -m compileall -q src
      - run: bash -n bootstrap.sh install.sh lksu-status.sh
      - name: Build and validate release wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import pathlib, re, zipfile
          p = pathlib.Path("pyproject.toml").read_text()
          version = re.search(r'^version\s*=\s*"([^"]+)"', p, re.M).group(1)
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, "Expected exactly one wheel"
          assert wheels[0].name == f"lksu-{version}-py3-none-any.whl", wheels[0].name
          with zipfile.ZipFile(wheels[0]) as archive:
              assert archive.testzip() is None, "Invalid wheel CRC"
              assert "lksu/cli.py" in archive.namelist()
              metadata = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              assert len(metadata) == 1
              text = archive.read(metadata[0]).decode()
              assert re.search(r"^Version: " + re.escape(version) + r"$", text, re.M)
          print("Validated:", wheels[0])
          PY
          python -m venv "$RUNNER_TEMP/lksu-wheel-test"
          "$RUNNER_TEMP/lksu-wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/lksu-wheel-test/bin/lksu" --help >/dev/null


  distro-container-smoke:
    name: distro detection (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, image: "ubuntu:24.04", distro: ubuntu }
          - { name: Debian 12, image: "debian:12", distro: debian }
          - { name: Rocky Linux 9, image: "rockylinux:9", distro: rocky }
          - { name: Fedora, image: "fedora:latest", distro: fedora }
          - { name: Alpine, image: "alpine:3.20", distro: alpine }
          - { name: Arch Linux, image: "archlinux:latest", distro: arch }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Read actual distro image metadata; no kernel changes
        env:
          IMAGE: ${{ matrix.image }}
          EXPECTED: ${{ matrix.distro }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'cat /etc/os-release' > "$RUNNER_TEMP/image-os-release"
          python tests/smoke_container_os_release.py "$RUNNER_TEMP/image-os-release" "$EXPECTED"
      - run: echo "Container image metadata does not prove kernel installation, boot, or rollback."
