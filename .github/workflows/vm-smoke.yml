name: isolated multi-distribution QEMU VM smoke

on:
  pull_request:
    paths:
      - ".github/workflows/vm-smoke.yml"
      - "tests/vm/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vm:
    name: isolated VM (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
            checksums_url: https://cloud-images.ubuntu.com/noble/current/SHA256SUMS
            checksum_algorithm: sha256
          - distro: debian
            image_url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
            checksums_url: https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS
            checksum_algorithm: sha512
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and cloud-init tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client
      - name: Download and checksum official cloud image
        env:
          IMAGE_URL: ${{ matrix.image_url }}
          CHECKSUMS_URL: ${{ matrix.checksums_url }}
          CHECKSUM_ALGORITHM: ${{ matrix.checksum_algorithm }}
        run: bash tests/vm/fetch-guest-image.sh
      - name: Boot guest, verify distinct Linux kernel and SSH
        env:
          EXPECTED_DISTRO: ${{ matrix.distro }}
        run: bash tests/vm/ubuntu-boot-smoke.sh
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.distro }}-diagnostics
          path: |
            vm-serial.log
            vm-qemu.log
          if-no-files-found: ignore
          retention-days: 7
